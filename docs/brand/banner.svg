<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="'Plus Jakarta Sans','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.86" cy="0.12" r="0.65">
      <stop offset="0" stop-color="#EF4444" stop-opacity=".26"/>
      <stop offset="1" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1" r="0.5">
      <stop offset="0" stop-color="#22C55E" stop-opacity=".10"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#000000"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- Mark: the app header's white tile with the Q message bubble and tick (same geometry as client/public/logo.svg) -->
  <g transform="translate(96 92) scale(0.42)">
    <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
    <g transform="translate(11 6)">
      <path d="M377 292.5 A144 144 0 1 0 284.5 385 L399.8 407.8 Z M336 248 A96 96 0 1 0 144 248 A96 96 0 1 0 336 248 Z" fill="#000000" fill-rule="evenodd" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>
      <path d="M190 252 L228 290 L294 216" fill="none" stroke="#22C55E" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Live kicker, as on the app's home screen -->
  <circle cx="364" cy="102" r="5" fill="#22C55E"/>
  <text x="378" y="108" fill="#A3A3A3" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" font-size="16" font-weight="500" letter-spacing="3">LIVE IPO TERMINAL</text>

  <text x="354" y="190" fill="#FFFFFF" font-size="96" font-weight="800" letter-spacing="-3">Qasid</text>
  <text x="358" y="236" fill="#E5E5E5" font-size="28" font-weight="600">Your messenger for Indian IPOs.</text>
  <text x="358" y="272" fill="#8A8A8A" font-size="20" font-weight="500">Live GMP · subscription · smart planner · instant allotment across 10 registrars</text>

  <g font-size="17" font-weight="700">
    <rect x="358" y="306" width="148" height="40" rx="20" fill="#DC2626"/>
    <text x="432" y="332" fill="#FFFFFF" text-anchor="middle">10 registrars</text>
    <rect x="518" y="306" width="118" height="40" rx="20" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="577" y="332" fill="#E5E5E5" text-anchor="middle">Live GMP</text>
    <rect x="648" y="306" width="130" height="40" rx="20" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="713" y="332" fill="#E5E5E5" text-anchor="middle">IPO planner</text>
    <rect x="790" y="306" width="132" height="40" rx="20" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="856" y="332" fill="#E5E5E5" text-anchor="middle">Push alerts</text>
    <rect x="934" y="306" width="170" height="40" rx="20" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".16"/>
    <text x="1019" y="332" fill="#E5E5E5" text-anchor="middle">Synced accounts</text>
