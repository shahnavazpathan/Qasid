openapi: 3.0.3
info:
  title: Indian IPO Data
  version: 1.0.0
  description: >
    Indian IPO calendar, price band, lot size, live category-wise subscription and listing gains for
    Mainboard and SME issues, plus DRHP / RHP filings with SEBI. Compiled from public exchange,
    registrar and SEBI pages and refreshed about every 90 seconds. Provided as is, without warranty;
    not investment advice.
servers:
  - url: https://qasid.thevellora.co.in/v1
paths:
  /ipos:
    get:
      summary: List IPOs
      description: Open, upcoming, closed (awaiting listing) and recently listed IPOs (last 45 days).
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, upcoming, closed, listed] }
        - name: type
          in: query
          schema: { type: string, enum: [mainboard, sme] }
        - name: q
          in: query
          description: Part of the company name
          schema: { type: string }
      responses:
        "200":
          description: IPOs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: "#/components/schemas/Ipo" } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
  /ipos/{id}:
    get:
      summary: One IPO
      parameters:
        - name: id
          in: path
          required: true
          description: The id from /ipos (NSE symbol, or a normalised name)
          schema: { type: string }
      responses:
        "200":
          description: The IPO
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: "#/components/schemas/Ipo" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "404": { $ref: "#/components/responses/Error" }
  /calendar:
    get:
      summary: IPO events by date
      description: Bidding opens, bidding closes, allotment and listing dates in a date range (default today + 30 days).
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date, example: "2026-11-01" }
        - name: to
          in: query
          schema: { type: string, format: date, example: "2026-11-30" }
      responses:
        "200":
          description: Events, ordered by date
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        event: { type: string, enum: [opens, closes, allotment, listing] }
                        id: { type: string }
                        name: { type: string }
                        type: { type: string, enum: [Mainboard, SME] }
                  meta: { $ref: "#/components/schemas/Meta" }
        "400": { $ref: "#/components/responses/Error" }
  /filings:
    get:
      summary: SEBI offer document filings
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [drhp, rhp], default: drhp }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Latest filings first
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        kind: { type: string, enum: [DRHP, UDRHP, RHP, Addendum, Filing] }
                        filedDate: { type: string, format: date, nullable: true }
                        url: { type: string }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              error: { type: string }
  schemas:
    Meta:
      type: object
      properties:
        updatedAt: { type: string, format: date-time }
        count: { type: integer }
        disclaimer: { type: string }
    Ipo:
      type: object
      properties:
        id: { type: string, example: VPFL }
        name: { type: string, example: Vedant Poly Fabs Limited }
        symbol: { type: string, nullable: true }
        type: { type: string, enum: [Mainboard, SME] }
        exchange: { type: string, nullable: true }
        status: { type: string, enum: [open, upcoming, closed, listed] }
        priceMin: { type: number, nullable: true }
        priceMax: { type: number, nullable: true }
        issuePrice: { type: number, nullable: true }
        lotSize: { type: integer, nullable: true }
        minInvestment: { type: number, nullable: true, description: "Minimum application in ₹ (2 lots for SME)" }
        issueSizeCr: { type: number, nullable: true, description: "Issue size in ₹ crore" }
        openDate: { type: string, format: date, nullable: true }
        closeDate: { type: string, format: date, nullable: true }
        allotmentDate: { type: string, format: date, nullable: true }
        listingDate: { type: string, format: date, nullable: true }
        subscription:
          type: object
          nullable: true
          properties:
            total: { type: number, nullable: true, description: "Times subscribed" }
            categories:
              type: array
              items:
                type: object
                properties:
                  category: { type: string, example: QIB }
                  times: { type: number, nullable: true }
            updatedAt: { type: string, nullable: true }
        subscriptionHistory: { type: array, items: { type: object }, description: "Day-wise subscription snapshots" }
        applications: { type: integer, nullable: true }
        listingPrice: { type: number, nullable: true }
        listingGainPct: { type: number, nullable: true }
        rhpUrl: { type: string, nullable: true }
