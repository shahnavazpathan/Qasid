<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPO Allotment Checker</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 30px 15px; background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif; color: #111827;
    }
    .container { max-width: 700px; margin: auto; }
    .card {
      background: white; padding: 30px; border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { margin-top: 0; margin-bottom: 8px; font-size: 28px; }
    .subtitle { color: #6b7280; margin-bottom: 28px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    select, textarea {
      width: 100%; padding: 13px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 16px; background: white;
    }
    select { margin-bottom: 8px; }
    textarea {
      min-height: 180px; resize: vertical; margin-bottom: 5px;
      font-family: Arial, Helvetica, sans-serif; text-transform: uppercase;
    }
    .counter { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 8px;
      background: #2563eb; color: white; font-size: 16px;
      font-weight: 600; cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 22px; }
    .status-message { padding: 14px; border-radius: 8px; margin-bottom: 12px; }
    .loading { background: #eff6ff; border: 1px solid #bfdbfe; }
    .error { background: #fef2f2; border: 1px solid #fecaca; }
    .result {
      border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 15px; margin-bottom: 10px; background: #fafafa;
    }
    .result-pan { font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;}
    .result-success { color: #166534; }
    .result-not-applied { color: #b45309; margin-top: 10px; }
    .result-error { color: #b91c1c; margin-top: 10px; }
    
    .investor-details {
      margin-top: 12px; padding: 12px; background: #ffffff;
      border: 1px solid #e2e8f0; border-radius: 6px;
      color: #334155; font-size: 14px; line-height: 1.6;
    }
    .investor-details strong { color: #0f172a; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .badge-green { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0;}
    .badge-red { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca;}
    
    .ipo-count { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>IPO Allotment Checker</h1>
      <div class="subtitle">Select an IPO and enter one or more PAN numbers.</div>

      <!-- IPO -->
      <label for="ipo">Select IPO</label>
      <select id="ipo">
        <option value="">Loading IPOs...</option>
      </select>
      <div id="ipoCount" class="ipo-count"></div>

      <!-- PAN -->
      <label for="pans">PAN Numbers</label>
      <textarea id="pans" placeholder="Enter one PAN per line&#10;&#10;ABCDE1234F&#10;PQRSX5678Z&#10;LMNOP1234Q" autocomplete="off"></textarea>
      <div id="panCount" class="counter">0 PANs</div>

      <!-- BUTTON -->
      <button id="checkButton">Check Allotment</button>

      <!-- RESULTS -->
      <div id="status"></div>
    </div>
  </div>

  <script>
    const ipoSelect = document.getElementById("ipo");
    const ipoCount = document.getElementById("ipoCount");
    const pansInput = document.getElementById("pans");
    const panCount = document.getElementById("panCount");
    const checkButton = document.getElementById("checkButton");
    const statusBox = document.getElementById("status");

    async function loadIpos() {
      ipoSelect.innerHTML = `<option value="">Loading IPOs...</option>`;
      try {
        const response = await fetch("/api/ipos");
        const result = await response.json();
        if (!result.success) throw new Error(result.error || "Failed to load IPO list.");
        
        ipoSelect.innerHTML = `<option value="">Select an IPO</option>`;
        result.ipos.forEach(ipo => {
          const option = document.createElement("option");
          option.value = ipo.clientId;
          option.textContent = ipo.name;
          ipoSelect.appendChild(option);
        });
        ipoCount.textContent = `${result.total} IPOs available`;
      } catch (error) {
        ipoSelect.innerHTML = `<option value="">Unable to load IPOs</option>`;
        showMessage(error.message, "error");
      }
    }

    pansInput.addEventListener("input", updatePanCount);
    function updatePanCount() {
      const pans = getPans();
      panCount.textContent = `${pans.length} PAN${pans.length === 1 ? "" : "s"}`;
    }

    function getPans() {
      return pansInput.value.split(/\r?\n|,/).map(pan => pan.trim().toUpperCase()).filter(Boolean);
    }

    function showMessage(message, type) {
      statusBox.innerHTML = "";
      const div = document.createElement("div");
      div.className = `status-message ${type}`;
      div.textContent = message;
      statusBox.appendChild(div);
    }

    function renderResults(results) {
      statusBox.innerHTML = "";
      results.forEach(result => {
        const resultBox = document.createElement("div");
        resultBox.className = "result";
        
        const panDiv = document.createElement("div");
        panDiv.className = "result-pan";
        
        let statusBadge = "";
        
        if (result.success && result.data) {
           const isAllotted = parseInt(result.data.Allotted) > 0;
           if (isAllotted) {
               statusBadge = `<span class="badge badge-green">ALLOTTED</span>`;
           } else {
               statusBadge = `<span class="badge badge-red">NOT ALLOTTED</span>`;
           }
        }
        
        panDiv.innerHTML = `<span>PAN: ${result.pan}</span> ${statusBadge}`;
        resultBox.appendChild(panDiv);

        if (result.error === "You have not applied for this IPO.") {
          const message = document.createElement("div");
          message.className = "result-not-applied";
          message.textContent = "You have not applied for this IPO.";
          resultBox.appendChild(message);
        } else if (result.error === "Invalid PAN") {
          const message = document.createElement("div");
          message.className = "result-error";
          message.textContent = "Invalid PAN format.";
          resultBox.appendChild(message);
        } else if (!result.success) {
          const message = document.createElement("div");
          message.className = "result-error";
          message.textContent = result.error || "Unable to check allotment.";
          resultBox.appendChild(message);
        } else {
          const detailsDiv = document.createElement("div");
          detailsDiv.className = "investor-details";
          detailsDiv.innerHTML = `
            <div style="margin-bottom: 5px;"><strong>Name:</strong> ${result.data.Name}</div>
            <div><strong>Shares Allotted:</strong> ${result.data.Allotted}</div>
          `;
          resultBox.appendChild(detailsDiv);
        }
        statusBox.appendChild(resultBox);
      });
    }

    checkButton.addEventListener("click", checkPans);

    async function checkPans() {
      const clientId = ipoSelect.value;
      const pans = getPans();

      if (!clientId) { showMessage("Please select an IPO.", "error"); return; }
      if (pans.length === 0) { showMessage("Please enter at least one PAN.", "error"); return; }
      if (pans.length > 50) { showMessage("Maximum 50 PANs at once.", "error"); return; }

      checkButton.disabled = true;
      checkButton.textContent = `Checking ${pans.length} PAN${pans.length === 1 ? "" : "s"}...`;
      showMessage(`Checking ${pans.length} PAN${pans.length === 1 ? "" : "s"}...`, "loading");

      try {
        const response = await fetch("/api/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ clientId, pans })
        });
        const result = await response.json();
        if (!result.success) {
          showMessage(result.error || "Unable to check allotment.", "error");
          return;
        }
        renderResults(result.results);
      } catch (error) {
        showMessage(error.message || "Something went wrong.", "error");
      } finally {
        checkButton.disabled = false;
        checkButton.textContent = "Check Allotment";
      }
    }

    loadIpos();
  </script>
</body>
</html>
